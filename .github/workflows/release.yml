name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Apple release credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$CSC_LINK" || { echo "::error::MACOS_CERTIFICATE fehlt"; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "::error::MACOS_CERTIFICATE_PASSWORD fehlt"; exit 1; }
          test -n "$APPLE_API_KEY_P8" || { echo "::error::APPLE_API_KEY_P8 fehlt"; exit 1; }
          test -n "$APPLE_API_KEY_ID" || { echo "::error::APPLE_API_KEY_ID fehlt"; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "::error::APPLE_API_ISSUER fehlt"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - run: npm ci
      - run: npm run revision
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: npm run verify
      - run: npm run dist
      - name: Verify Developer ID signature
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/AI Print Studio.app"
          codesign -dv --verbose=4 "release/mac-arm64/AI Print Studio.app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Authority=Developer ID Application:" "$RUNNER_TEMP/codesign.txt" || {
            echo "::error::App wurde nicht mit Developer ID Application signiert"
            exit 1
          }
      - name: Notarize and staple DMG
        run: |
          DMG_PATH="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH" || { echo "::error::Kein DMG gefunden"; exit 1; }
          xcrun notarytool submit "$DMG_PATH" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.dmg.blockmap
          generate_release_notes: true
          draft: false
