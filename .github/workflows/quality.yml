name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build:depth-worker
      - run: npm run smoke:depth-worker
      - run: npm run build:dmg-background
      - run: npx electron-builder --mac dir --publish never
      - run: npm run smoke:release
